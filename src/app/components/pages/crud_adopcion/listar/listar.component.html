<div class="container">
  <h1>Lista de Adopciones</h1>
  <table mat-table [dataSource]="adopciones" class="mat-elevation-z8">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let adopcion"> {{adopcion.id}} </td>
    </ng-container>

    <ng-container matColumnDef="estado">
      <th mat-header-cell *matHeaderCellDef> Estado </th>
      <td mat-cell *matCellDef="let adopcion"> {{adopcion.estado}} </td>
    </ng-container>

    <ng-container matColumnDef="fecha_resolucion">
      <th mat-header-cell *matHeaderCellDef> Fecha Resolución </th>
      <td mat-cell *matCellDef="let adopcion"> {{adopcion.fecha_resolucion}} </td>
    </ng-container>

    <ng-container matColumnDef="fecha_solicitud">
      <th mat-header-cell *matHeaderCellDef> Fecha Solicitud </th>
      <td mat-cell *matCellDef="let adopcion"> {{adopcion.fecha_solicitud}} </td>
    </ng-container>

    <ng-container matColumnDef="mascota_id">
      <th mat-header-cell *matHeaderCellDef> Mascota ID </th>
      <td mat-cell *matCellDef="let adopcion"> {{adopcion.mascota_id}} </td>
    </ng-container>

    <ng-container matColumnDef="usuario_id">
      <th mat-header-cell *matHeaderCellDef> Usuario ID </th>
      <td mat-cell *matCellDef="let adopcion"> {{adopcion.usuario_id}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
